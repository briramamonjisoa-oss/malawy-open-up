name: Deploy MALAWY OPEN UP preview to Cloudflare

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: malawy-open-up-preview
  cancel-in-progress: true

jobs:
  deploy-preview:
    name: Build and deploy isolated Cloudflare preview Worker
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pull request
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build application
        run: npm run build

      - name: Create preview-only Wrangler config
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const config = JSON.parse(fs.readFileSync('wrangler.jsonc', 'utf8'));
          config.name = 'malawy-open-up-preview';
          delete config.triggers;
          fs.writeFileSync('wrangler.preview.jsonc', JSON.stringify(config, null, 2));
          NODE

      - name: Deploy isolated preview Worker
        run: npx wrangler deploy --config wrangler.preview.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
