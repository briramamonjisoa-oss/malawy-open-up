name: Build MALAWY OPEN UP signed APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'android/**'
      - '.github/workflows/build-android-apk.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.MALAWY_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.MALAWY_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MALAWY_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.MALAWY_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64" || (echo "Missing MALAWY_KEYSTORE_BASE64" && exit 1)
          test -n "$STORE_PASSWORD" || (echo "Missing MALAWY_STORE_PASSWORD" && exit 1)
          test -n "$KEY_ALIAS" || (echo "Missing MALAWY_KEY_ALIAS" && exit 1)
          test -n "$KEY_PASSWORD" || (echo "Missing MALAWY_KEY_PASSWORD" && exit 1)

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Use Android SDK preinstalled on GitHub runner
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          ls -la "${ANDROID_HOME:-/usr/local/lib/android/sdk}"

      - name: Restore persistent signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.MALAWY_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/malawy-release-v2.jks"
          chmod 600 "$RUNNER_TEMP/malawy-release-v2.jks"
          echo "MALAWY_STORE_FILE=$RUNNER_TEMP/malawy-release-v2.jks" >> "$GITHUB_ENV"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build signed release APK
        env:
          MALAWY_STORE_PASSWORD: ${{ secrets.MALAWY_STORE_PASSWORD }}
          MALAWY_KEY_ALIAS: ${{ secrets.MALAWY_KEY_ALIAS }}
          MALAWY_KEY_PASSWORD: ${{ secrets.MALAWY_KEY_PASSWORD }}
        run: gradle --no-daemon -p android assembleRelease

      - name: Verify APK signature
        run: |
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n1)/apksigner" verify --verbose "$APK"

      - name: Publish APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v1.0.30-in-app-updater
          name: MALAWY OPEN UP Android v1.0.30 — notifications et navigation
          files: android/app/build/outputs/apk/release/app-release.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MALAWY-OPEN-UP-APK-v1.0.30
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30
