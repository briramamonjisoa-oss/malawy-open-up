<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050506">
<title>MALAWY OPEN UP</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#050506;color:#f3eee3;font-family:Inter,system-ui,-apple-system,sans-serif}
body{min-height:100svh;display:grid;place-items:center;overflow:hidden}
.splash{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;text-align:center;padding:28px}
.mark{width:82px;height:82px;border:1px solid rgba(214,190,132,.58);border-radius:19px;background:linear-gradient(145deg,rgba(255,255,255,.07),rgba(255,255,255,.015));display:grid;place-items:center;color:#d8c18a;font-weight:900;font-size:56px;line-height:1;box-shadow:0 12px 45px #0009,inset 0 1px #ffffff12}
.name{font-size:19px;letter-spacing:.19em;font-weight:750;color:#f0e8d6}.sub{margin-top:-15px;font-size:10px;letter-spacing:.32em;color:#a69a7b}
.dots{display:flex;gap:8px;margin-top:12px}.dots i{width:7px;height:7px;border-radius:50%;background:#d8c18a;opacity:.3;animation:pulse 1.1s ease-in-out infinite}.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}.dots i:nth-child(4){animation-delay:.45s}
@keyframes pulse{0%,80%,100%{opacity:.25;transform:scale(.75)}40%{opacity:1;transform:scale(1.15)}}
</style>
</head>
<body><main class="splash" aria-label="MALAWY OPEN UP">
<div class="mark">M</div>
<div class="name">MALAWY OPEN UP</div>
<div class="sub">FREE FIRE COMMUNITY</div>
<div class="dots" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
</main></body>
</html>
